alt = "RoboWait Robot-Mobility-Panel"
caption = "Robotik: Steuer- und Statusfunktionen können als Teil des experimentellen Settings eingebunden werden."

[menueplaner.hero]
badge = "Private PWA"
lead = "Wochenmenüs, Rezepte, Einkauf, Kalender und Druck in einer App, die für den echten Küchenalltag gebaut ist."
body = "Der Menüplaner ersetzt die frühere Excel-Planung durch eine reaktive Web-App. Er hilft beim schnellen Befüllen einer Woche, beim Wiederfinden bewährter Rezepte, beim Vermeiden von Wiederholungen, beim Einbezug von Kalenderterminen und beim Erstellen einer Einkaufsliste."

[menueplaner.daily]
eyebrow = "Alltagstauglich"
title = "Planen, kochen, einkaufen - ohne Tabellenpflege"
body = [
  "Die Startansicht zeigt eine 8-Tage-Planung mit Vorschau auf die Folgewoche. Änderungen werden automatisch gespeichert, lassen sich rückgängig machen und können bei Bedarf durch eine Wochensperre geschützt werden.",
  "Rezepte können aus der Bibliothek übernommen, per Drag and Drop auf Tage gezogen oder als intelligente Vorschläge eingesetzt werden. Beilagen, Gemüse, Salat, Vorspeise und Dessert bleiben als eigene Informationen erhalten."
]
points = [
  "Wochenwechsel ohne Speicherdialog dank Auto-Speichern",
  "Tageskarten mit Hauptgang, Beilage, Gemüse, Salat, Vorspeise und Dessert",
  "Wochensperre gegen versehentliche Änderungen",
  "Undo und Redo für Korrekturen",
  "Einheitliche Nutzung auf PC, Tablet und Smartphone",
  "PWA-Installation für schnellen Start wie eine App"
]

[[menueplaner.steps]]
label = "01"
title = "Woche öffnen"
body = "Mit Heute, Datumsauswahl oder Pfeilen wird die passende Kalenderwoche geöffnet. Der Wochenkopf bleibt beim Scrollen sichtbar."

[[menueplaner.steps]]
label = "02"
title = "Rezepte wählen oder vorschlagen lassen"
body = "Die Bibliothek filtert nach Gang, Typ, Ernährung, Kategorie, Favorit und Saison. Vorschläge berücksichtigen Historie, Saison und Wochenmix."

[[menueplaner.steps]]
label = "03"
title = "Kalenderhinweise einbeziehen"
body = "Outlook-ICS-Termine können übernommen werden. Pro Tag erscheinen kompakte Hinweise, damit die Menüwahl zum Tagesprogramm passt."

[[menueplaner.steps]]
label = "04"
title = "Einkaufsliste erstellen"
body = "Zutaten aus Vorspeise, Hauptgang und Dessert werden zusammengeführt, bereinigt und nach Warengruppen gruppiert."

[[menueplaner.steps]]
label = "05"
title = "Plan drucken"
body = "Die Druckansicht bringt vier Wochen auf eine A4-Seite, inklusive Typ, Personen, Kalenderhinweisen, Beilagen und Zusatzgängen."

[[menueplaner.features]]
kicker = "Wochenplan"
title = "Schnell planen und sicher ändern"
body = "Tage lassen sich befüllen, tauschen, sperren, korrigieren und wieder freigeben. Das ist für wiederkehrende Haushaltsplanung wichtiger als eine grosse Projektverwaltung."

[[menueplaner.features]]
kicker = "Rezepte"
title = "Bibliothek mit Kontext"
body = "Rezepte enthalten Gang, Typ, Kategorie, Ernährung, Saison, Favorit, Foto, Zutaten, Anleitung, Beilage, Gemüse und Notizen. Die Werte helfen später beim Suchen und Vorschlagen."

[[menueplaner.features]]
kicker = "Vorschläge"
title = "Intelligente Rotation"
body = "Die Vorschlagslogik vermeidet Wiederholungen im 28-Tage-Fenster, erkennt Menüfamilien, beachtet Saison und mischt Fleisch, Fisch, Vegi oder Vegan ausgewogener."

[[menueplaner.features]]
kicker = "Import"
title = "Rezeptdaten schneller erfassen"
body = "QR-Scan, URL-Import, Foto-Import und KI-Autofill helfen, neue Rezepte nicht mühsam von Hand abzutippen."

[[menueplaner.features]]
kicker = "Kalender"
title = "Termine im Blick"
body = "Ein Outlook-ICS-Kalender kann zyklisch geprüft werden. Neue, geänderte und gelöschte Termine werden sichtbar, bevor sie übernommen werden."

[[menueplaner.features]]
kicker = "Einkauf und Druck"
title = "Vom Plan zur Küche"
body = "Die Einkaufsliste fasst Zutaten zusammen. Die A4-Druckansicht macht den Plan auch ohne Bildschirm in der Küche nutzbar."

