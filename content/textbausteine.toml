[home.hero]
title = "arkons.ch"
lead = "Pragmatische Beratung, Prozesswissen und praxistaugliche Software im Gesundheitswesen - von Beat Arnet."

[produkte]
robowait_summary = "RoboWait unterstützt ein BFH-Laborexperiment von der Einladung über Consent, Terminbuchung und Laborsteuerung bis zu Fragebogen, Export und Audit. Die Anwendung ersetzt viele einzelne Listen und Mails durch einen nachvollziehbaren digitalen Prozess."
menueplaner_summary = "Der Menüplaner ist eine private Web-App für den Küchenalltag: Wochenmenüs, Rezeptbibliothek, intelligente Vorschläge, Outlook-Kalenderhinweise, Einkaufsliste, Druckansicht und PWA-Nutzung auf Handy, Tablet oder PC."

[robowait.hero]
badge = "BFH Laborexperiment"
lead = "Digitale Prozessunterstützung für Studien, bei denen Teilnehmende, Laborbetrieb, Fragebögen und Robotik sauber zusammenspielen müssen."
body = "RoboWait wurde für das BFH-Laborexperiment \"Robots in the Waiting Room\" entwickelt. Die Anwendung bildet den ganzen Studienweg ab: Einladung, Teilnahmeentscheid, Einwilligung, Terminbuchung, Labor-Session, Randomisierung, Fragebögen, Export und Audit. Damit wird aus E-Mails, Tabellen und manuellen Entscheiden ein versionierter, prüfbarer Ablauf."

[robowait.study]
eyebrow = "Studienbetrieb"
title = "Ein System vom ersten Kontakt bis zur Auswertung"
body = [
  "Teilnehmende sehen nur die Schritte, die für sie gerade freigegeben sind. Das Studienteam sieht im Dashboard, welche Personen eingeladen wurden, wer zugesagt oder abgelehnt hat, welche Termine gebucht sind und wo eine manuelle Aktion nötig ist.",
  "Admins pflegen Probanden, Slots, Mailvorlagen, Fragebögen, Blueprints, Benutzer, Einstellungen und Exporte. Kritische Statuswechsel bleiben im Audit-Protokoll nachvollziehbar."
]
points = [
  "Login, Consent, Demografie, Terminbuchung und Fragebögen im Probandenbereich",
  "Adminbereich für Probandenverwaltung, Slot-Planung, Mail-Templates, Blueprints, Fragebögen, Statistik und Audit",
  "Randomisierung mit einfacher, blockweiser oder manueller Zuteilung",
  "Exportpakete für Studien-, Kontakt-, Codebook-, Prozess- und Rohantwortdaten",
  "Realtime-Unterstützung mit Laravel Reverb für operative Laborsteuerung",
  "Scheduler für automatische Mails und Timer-Schritte"
]

[[robowait.steps]]
label = "01"
title = "Einladen und Antworten erfassen"
body = "Signierte Links für Zusage oder Absage schreiben die Antwort direkt in den Workflow. Das verhindert spätere Nachträge aus verstreuten Mails."

[[robowait.steps]]
label = "02"
title = "Einwilligung und Termin"
body = "Teilnehmende erledigen Consent, Demografie und Terminbuchung im eigenen Bereich. Änderungen wie Umbuchungen bleiben im System sichtbar."

[[robowait.steps]]
label = "03"
title = "Labortag steuern"
body = "Experimentatorinnen und Experimentatoren sehen aktive Sessions, Laborstationen und den nächsten freigegebenen Schritt."

[[robowait.steps]]
label = "04"
title = "Roboter und Bedingung einbinden"
body = "Der Robotereinsatz ist Teil des Studienablaufs und kann mit Gruppenzuteilung, Wartephase und Fragebogen verbunden werden."

[[robowait.steps]]
label = "05"
title = "Exportieren und prüfen"
body = "Nach der Durchführung stehen getrennte Exportpakete für Statistik, Kontakte, Codebook, Prozesslog und Rohantworten bereit."

[[robowait.features]]
kicker = "Blueprints"
title = "Ablauf modellieren statt hart verdrahten"
body = "Der Studienprozess wird als Blueprint geführt. Schritte, Rollen, Entscheidungen, Timer, Fragebögen und Mailaktionen können geändert werden, ohne laufende oder abgeschlossene Sessions unsichtbar zu verfälschen."

[[robowait.features]]
kicker = "Versionierung"
title = "Historische Abläufe bleiben erhalten"
body = "Neue Blueprint-Versionen können aktiviert werden, während abgeschlossene Fälle mit der tatsächlich verwendeten Version verbunden bleiben. Das ist für spätere Auswertungen entscheidend."

[[robowait.features]]
kicker = "Teilnehmende"
title = "Einfacher Probandenbereich"
body = "Der Probandenbereich zeigt nur die aktuell relevanten Aufgaben. So bleibt der Ablauf trotz komplexer Studienlogik verständlich."

[[robowait.features]]
kicker = "Labor"
title = "Dashboard für den Studientag"
body = "Offene Aufgaben, aktive Sessions, nächste Schritte und Laborstationen werden im Dashboard sichtbar. Das reduziert spontane Koordination am Labortag."

[[robowait.features]]
kicker = "Daten"
title = "Saubere Exportpakete"
body = "Studienwerte, Kontaktdaten, Rohantworten, Codebook und Prozesslog werden getrennt exportiert. Das erleichtert Statistik und Datenschutz."

[[robowait.features]]
kicker = "Betrieb"
title = "Web, Reverb und Scheduler"
body = "RoboWait besteht im Betrieb aus Weboberfläche, Realtime-Dienst und Hintergrundverarbeitung. Dadurch können sichtbare Arbeit, Live-Status und automatische Schritte getrennt geprüft werden."

